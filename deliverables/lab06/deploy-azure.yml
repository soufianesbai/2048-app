name: Lab 06 - CD Azure

on:
  push:
    branches:
      - main
      - lab06
  workflow_dispatch:

env:
  NODE_VERSION: 22

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate static site
        run: pnpm generate

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: 2048-static
          path: .output/public/
          retention-days: 1

  deploy-qa:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: qa

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v6
        with:
          name: 2048-static
          path: .output/public/

      - name: Deploy to QA on Azure SWA
        run: npx @azure/static-web-apps-cli deploy .output/public/ --deployment-token ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }} --env default

  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-qa
    environment:
      name: production

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v6
        with:
          name: 2048-static
          path: .output/public/

      - name: Deploy to production on Azure SWA
        run: npx @azure/static-web-apps-cli deploy .output/public/ --deployment-token ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }} --env default
